<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StickFight Overlay</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<style>
  @font-face { font-family: 'StickPix'; src: url('../assets/stickpix.ttf') format('truetype'); font-display: block; }
  :root {
    --ink: #0a0a0a;
    --bg: #17171c;
    --card: #202027;
    --raised: #2b2b34;
    --line: #3a3a46;
    --text: #ecebe6;
    --muted: #8b8b99;
    --accent: #ff7a1a;
    --accent-hi: #ffb15c;
    --blue: #2f7dff;
    --red: #ff2a2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  body, button, input, select { font-family: 'StickPix', monospace; font-size: 16px; line-height: 1; text-transform: uppercase; -webkit-font-smoothing: none; }
  canvas#c { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  canvas#c.capture { pointer-events: auto; cursor: grab; }
  canvas#c.capture.dragging { cursor: grabbing; }
  canvas#c.tool { pointer-events: auto; cursor: crosshair; }
  .pix { image-rendering: pixelated; }

  /* ---- retro chrome ---- */
  .frame { background: var(--bg); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line), 4px 4px 0 rgba(0,0,0,0.55); }
  .btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--text);
    background: var(--raised); border: 2px solid var(--ink); box-shadow: inset -2px -2px 0 rgba(0,0,0,0.35), inset 2px 2px 0 rgba(255,255,255,0.08);
    padding: 7px 10px 6px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #363642; }
  .btn:active { box-shadow: inset 2px 2px 0 rgba(0,0,0,0.45); transform: translateY(1px); }
  .btn.on { background: var(--accent); color: var(--ink); box-shadow: inset -2px -2px 0 rgba(0,0,0,0.25), inset 2px 2px 0 rgba(255,255,255,0.35); }
  .btn.big { width: 100%; padding: 12px; font-size: 24px; background: var(--accent); color: var(--ink); }
  .btn.big:hover { background: var(--accent-hi); }
  .btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); background: var(--raised); border-color: var(--ink); }

  /* ---- dock ---- */
  #ui { position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 30; color: var(--text); }
  #ui.hidden { display: none; }
  #dock { width: 60px; padding: 6px; display: flex; flex-direction: column; gap: 6px; align-items: center; border-right: none; }
  #dock .logo { width: 44px; height: 30px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid var(--line); margin-bottom: 2px; padding-bottom: 4px; }
  #dock .dbtn { width: 44px; height: 44px; padding: 0; }
  #dock .dbtn[data-fly].on { background: var(--raised); box-shadow: inset 0 0 0 2px var(--accent); }
  #dock .sep { width: 36px; height: 2px; background: var(--line); margin: 2px 0; }
  #dock .dbtn .dot { position: absolute; right: 3px; top: 3px; width: 6px; height: 6px; background: var(--accent); border: 1px solid var(--ink); display: none; }
  #dock .dbtn .dot.show { display: block; }
  #tab { position: fixed; right: 0; top: 50%; transform: translateY(-50%); width: 34px; height: 96px; padding: 0; display: none; z-index: 30;
    flex-direction: column; gap: 8px; border-right: none; border-left: 4px solid var(--accent); }
  #tab .vt { writing-mode: vertical-rl; color: var(--accent); font-size: 16px; letter-spacing: 2px; }
  #ui.mini #dock, #ui.mini .fly { display: none !important; }
  #ui.mini + #tab, body.mini #tab { display: flex; }

  .tip { position: absolute; right: 64px; top: 50%; transform: translateY(-50%); background: var(--ink); color: var(--text); padding: 6px 8px 5px;
    white-space: nowrap; pointer-events: none; display: none; border-left: 4px solid var(--accent); }
  .dbtn:hover .tip { display: block; }
  #ui.flyopen .dbtn:hover .tip { display: none; }

  /* ---- fly-out cards ---- */
  .fly { position: absolute; right: 66px; top: 0; width: 300px; max-height: 88vh; overflow-y: auto; display: none; scrollbar-width: thin; scrollbar-color: var(--line) var(--bg); }
  .fly.open { display: block; }
  .fly .bar { display: flex; align-items: center; justify-content: space-between; background: var(--ink); color: var(--accent); padding: 8px 8px 7px 10px; }
  .fly .bar small { color: var(--muted); font-size: 16px; }
  .fly .body { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .label { color: var(--muted); font-size: 16px; display: flex; justify-content: space-between; }
  .row { display: flex; gap: 6px; }
  .row > .btn { flex: 1; }
  .seg { display: flex; }
  .seg .btn { flex: 1; margin-left: -2px; padding-left: 4px; padding-right: 4px; }
  .seg .btn:first-child { margin-left: 0; }

  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .slot { position: relative; height: 116px; padding: 4px 4px 14px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    background: var(--card); border: 2px solid var(--ink); cursor: pointer; box-shadow: inset 0 0 0 2px #262630; }
  .slot:hover { box-shadow: inset 0 0 0 2px var(--line); }
  .slot canvas { width: 64px; height: 72px; }
  .slot .nm { font-size: 16px; }
  .slot.empty canvas { opacity: 0.18; filter: grayscale(1); }
  .slot.empty .nm { color: var(--muted); }
  .slot .plus { position: absolute; top: 30px; left: 0; right: 0; text-align: center; font-size: 24px; color: var(--muted); display: none; }
  .slot.empty:hover .plus { display: block; color: var(--accent); }
  .slot .hp { position: absolute; left: 8px; right: 8px; bottom: 4px; height: 6px; background: #3a1010; border: 2px solid var(--ink); }
  .slot .hp i { display: block; height: 100%; background: #40e070; }
  .slot .x { position: absolute; right: 2px; top: 2px; width: 22px; height: 22px; padding: 0; font-size: 16px; display: none; }
  .slot:not(.empty):hover .x { display: flex; }
  .slot .lv { position: absolute; left: 6px; top: 6px; color: var(--muted); font-size: 16px; }
  .slot .team { position: absolute; right: 6px; top: 6px; width: 10px; height: 10px; border: 2px solid var(--ink); }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tile { flex-direction: column; height: 70px; gap: 6px; padding: 6px 2px 5px; }
  .tile svg { width: 32px; height: 32px; }
  .tile.on { background: var(--raised); box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); }
  .slot .pw { position: absolute; right: 6px; bottom: 16px; width: 12px; height: 12px; border: 2px solid var(--ink); display: none; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mode { flex-direction: column; height: 76px; gap: 8px; }
  .switch { display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 4px 0; }
  .switch .knob { width: 44px; height: 22px; border: 2px solid var(--ink); background: #2a1a1a; position: relative; }
  .switch .knob::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--muted); }
  .switch.on .knob { background: #13361f; }
  .switch.on .knob::after { left: 24px; background: #40e070; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 10px; background: var(--ink); border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 20px; background: var(--accent); border: 2px solid var(--ink); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 18px; background: var(--accent); border: 2px solid var(--ink); border-radius: 0; cursor: pointer; }
  .hint { color: var(--muted); line-height: 1.4; }
  .status { color: var(--muted); min-height: 16px; line-height: 1.3; }
  .electron-only { display: none !important; }
  body.electron .electron-only { display: flex !important; }

  #toolhint { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20; display: none; padding: 8px 12px 7px; color: var(--text); white-space: nowrap; }
  #toolhint b { color: var(--accent); font-weight: normal; }
  #toast { position: fixed; bottom: 64px; right: 80px; z-index: 40; display: none; padding: 10px 12px 9px; color: var(--text); max-width: 360px; line-height: 1.3; }

  /* Browser demo only: a fake desktop with draggable windows. */
  body.demo { background: radial-gradient(1200px 700px at 30% 20%, #3a5f8f, #182433 70%); }
  body.demo #taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: 40px; background: rgba(15,18,24,0.92); }
  .fakewin { position: fixed; background: #f4f5f7; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); overflow: hidden;
    font-family: system-ui, sans-serif; text-transform: none; font-size: 13px; }
  .fakewin .bar { height: 30px; background: #dfe3ea; display: flex; align-items: center; padding: 0 10px; font-size: 12px; color: #333; cursor: move; }
  .fakewin .body { padding: 12px; color: #555; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="toolhint" class="frame"></div>
<div id="toast" class="frame"></div>

<div id="ui">
  <div id="dock" class="frame">
    <div class="logo" data-icon="logo"></div>
    <button class="btn dbtn" data-tool="hand"><span data-icon="hand"></span><span class="tip">Hand · grab &amp; throw</span></button>
    <button class="btn dbtn" data-tool="pencil"><span data-icon="pencil"></span><span class="tip">Pencil · draw platforms</span></button>
    <button class="btn dbtn" data-tool="eraser"><span data-icon="eraser"></span><span class="tip">Eraser</span></button>
    <button class="btn dbtn" data-tool="bomb"><span data-icon="bomb"></span><span class="tip">Bomb</span></button>
    <button class="btn dbtn" data-tool="smite"><span data-icon="bolt"></span><span class="tip">Lightning</span></button>
    <button class="btn dbtn" data-tool="spawn"><span data-icon="spawn"></span><span class="tip">Spawn · click to drop one</span></button>
    <div class="sep"></div>
    <button class="btn dbtn" data-fly="fighters"><span data-icon="fighter"></span><span class="tip">Fighters</span></button>
    <button class="btn dbtn" data-fly="armory"><span data-icon="armory"></span><span class="tip">Armory · weapons &amp; powers</span></button>
    <button class="btn dbtn" data-fly="match"><span data-icon="swords"></span><span class="tip">Match</span></button>
    <button class="btn dbtn" data-fly="settings"><span data-icon="gear"></span><span class="dot" id="upd-dot"></span><span class="tip">Settings</span></button>
    <div class="sep"></div>
    <button class="btn dbtn ghost" id="mini"><span data-icon="collapse"></span><span class="tip">Tuck away</span></button>
  </div>

  <div class="fly frame" id="fly-fighters">
    <div class="bar">Fighters <small id="count"></small></div>
    <div class="body">
      <div class="slots" id="slots"></div>
      <div>
        <div class="label">New fighters fight like</div>
        <div class="seg" id="arch" style="margin-top:6px">
          <button class="btn on" data-arch="" title="Each color's own style">Any</button>
          <button class="btn" data-arch="Brawler" title="Brawler: all-out aggression">Brw</button>
          <button class="btn" data-arch="Tactician" title="Tactician: parries and punishes">Tac</button>
          <button class="btn" data-arch="Acrobat" title="Acrobat: wall jumps and air combos">Acr</button>
          <button class="btn" data-arch="Zoner" title="Zoner: keeps away with blasts">Zon</button>
        </div>
      </div>
      <div class="row">
        <button class="btn" id="add-rand">+ Random</button>
        <button class="btn" id="heal">Heal</button>
        <button class="btn" id="clear-all">Clear</button>
      </div>
    </div>
  </div>

  <div class="fly frame" id="fly-armory">
    <div class="bar">Armory <small id="arm-count"></small></div>
    <div class="body">
      <div class="label">Weapons</div>
      <div class="tiles" id="tiles-weapons"></div>
      <div class="label">Items</div>
      <div class="tiles" id="tiles-items"></div>
      <div class="label">Power fruits</div>
      <div class="tiles" id="tiles-powers"></div>
      <div class="hint" id="arm-desc">Pick something, then click a fighter to give it, or click anywhere to drop it.</div>
      <div class="row">
        <button class="btn" id="arm-rain">Item rain</button>
        <button class="btn" id="arm-clear">Clear items</button>
      </div>
      <button class="btn" id="arm-strip">Remove all powers</button>
    </div>
  </div>

  <div class="fly frame" id="fly-match">
    <div class="bar">Match <small id="round"></small></div>
    <div class="body">
      <div class="modes" id="mode">
        <button class="btn mode" data-mode="ffa"><span data-icon="swords"></span>FFA</button>
        <button class="btn mode" data-mode="teams"><span data-icon="teams"></span>Teams</button>
        <button class="btn mode" data-mode="peace"><span data-icon="heart"></span>Peace</button>
      </div>
      <button class="btn big" id="brawl">Fight!</button>
      <div class="switch" id="slowmo"><span>Slow-mo</span><span class="knob"></span></div>
      <div class="switch" id="pause"><span>Pause</span><span class="knob"></span></div>
    </div>
  </div>

  <div class="fly frame" id="fly-settings">
    <div class="bar">Settings <small id="ver"></small></div>
    <div class="body">
      <div>
        <div class="label">Fighter size</div>
        <div class="seg" id="size" style="margin-top:6px">
          <button class="btn" data-size="small">S</button><button class="btn" data-size="medium">M</button><button class="btn" data-size="large">L</button>
        </div>
      </div>
      <div>
        <div class="label">Pixel size</div>
        <div class="seg" id="pixel" style="margin-top:6px">
          <button class="btn" data-px="1" title="High resolution">Fine</button><button class="btn" data-px="2">Classic</button><button class="btn" data-px="3">Chunky</button>
        </div>
      </div>
      <div>
        <div class="label"><span>Break between rounds</span><span id="rest-val"></span></div>
        <input type="range" id="rest" min="1" max="20" step="1" style="margin-top:8px">
      </div>
      <div class="switch" id="cinematic"><span>Cinematic supers</span><span class="knob"></span></div>
      <div class="switch" id="debug"><span>Show platforms</span><span class="knob"></span></div>
      <div class="row">
        <button class="btn" id="clear-lines">Clear lines</button>
        <button class="btn" id="reset-ai">Reset AI</button>
      </div>
      <div class="electron-only" style="flex-direction:column;gap:8px">
        <div class="label">Updates</div>
        <div class="switch" id="auto-upd"><span>Auto update</span><span class="knob"></span></div>
        <button class="btn" id="check-upd">Check now</button>
        <div class="status" id="upd-status"></div>
        <div class="row">
          <button class="btn" id="hide-all">Hide pets</button>
          <button class="btn" id="quit">Quit</button>
        </div>
      </div>
      <div class="hint" id="demo-hint"></div>
    </div>
  </div>
</div>
<button class="btn" id="tab" title="Show StickFight tools"><span data-icon="expand"></span><span class="vt">Tools</span></button>

<script src="game/poses.js"></script>
<script src="game/moves.js"></script>
<script src="game/ai.js"></script>
<script src="game/fighter.js"></script>
<script src="game/world.js"></script>
<script src="game/render.js"></script>
<script src="game/arsenal.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
